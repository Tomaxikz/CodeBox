[package]
name = "CodeBox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = {
    version = "0.9",
    default-features = false,
    features = [
        "runtime-tokio",
        "tls-rustls-ring",
        "postgres",
        "macros",
        "migrate",
        "chrono",
        "uuid",
        "json",
    ],
}
